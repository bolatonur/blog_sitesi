<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazarlarımız</title>
    
    <link rel="stylesheet" type="text/css" href="../styles/yazarlar_style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

    <div class="header"> 
        <div class="sitelogo" onclick="location.href='anasayfa.html'">
            tech<span>blog</span>
        </div>

        <div class="butonlar">
            <a href="anasayfa.html"><button>Anasayfa</button></a>
            <a href="hakkimizda.html"><button>Hakkımızda</button></a>
            <a href="bloglar.html"><button>Bloglar</button></a>
            <button style="color: var(--accent); font-weight: 600;">Yazarlar</button>
            
            <button id="theme-toggle">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </div>

    <div class="footer">
        <p>© 2025 techblog • Tüm Hakları Saklıdır</p>
    </div>

    <script>
        // tema değiştirme olayını diğer sayfalarla aynı yaptım bozulmasın diye
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        themeIcon.innerText = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeIcon.innerText = newTheme === 'dark' ? '☀️' : '🌙';
        });
        
        // burdaki eski title değiştirme kodunu sildim gerek yoktu kafa karıştırmasın
    </script>

</body>
</html>
