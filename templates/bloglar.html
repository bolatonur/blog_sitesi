<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloglar</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bloglar_style.css') }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <script>
        const SUN_ICON = "{{ url_for('static', filename='imgs/sun.svg') }}";
        const MOON_ICON = "{{ url_for('static', filename='imgs/moon.svg') }}";
    </script>

</head>
<body>

    <header class="header">
        <div class="sitelogo"  onclick="location.href='/'">
            noktalı<span>virgül</span>;
        </div>

        <div class="butonlar">

            <div class="newbtn">
                <a href="/"><button>Anasayfa</button></a>
                <button style="color: var(--accent); font-weight: 600;">Bloglar</button>
                <a href="/hakkimizda"><button>Hakkımızda</button></a>
            </div>
            
            <button id="theme-toggle">
                <img id="theme-icon" src="" alt="Tema İkonu" width="24" height="24">
            </button>
        </div>
    </header>

     

    <div class="blog-container">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 1.5rem; ">
        <input type="text" id="arama" class="aramaCubugu" onkeyup="aramaFonksiyonu()" placeholder="Blog ara!">
        </div>

        <ul id="blog-listesi">
        {% for yazi in yazilar %}

            <li style="list-style: none;">
            <div class="blog">
                <div class="picturediv">
                    <a href="{{ url_for('blog_detay', post_slug=yazi.slug) }}">
                        <img class="picture" src="{{ yazi.kapak }}">
                    </a>
                </div>        
                <div class="demoicerik">
                    <a href="{{ url_for('blog_detay', post_slug=yazi.slug) }}">
                        <h1 class="baslik">{{ yazi.baslik }}</h1>
                    </a>
                    <p class="yazi">{{ yazi.ozet }}</p>
                </div>
            </div>
            </li> 

        {% endfor %}
        </ul>


    </div>

    <footer class="footer">
        <p>© 2025 noktalivirgul </p>
        <p>İletişim için - contact@noktalivirgul.com </p> 
    </footer>

    <script src="{{ url_for('static', filename='js/bloglar_script.js') }}">
 
    </script>

</body>
</html>
